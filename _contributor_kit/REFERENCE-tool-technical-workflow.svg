<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.4" fill="#c8d4df"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15324d" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52708c"/></marker>
    <style>
      .group{fill:#fff;stroke:#b7c7d5;stroke-width:1.5;rx:18}.tag{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#53718c}.node{fill:#fff;stroke:#9eb4c6;stroke-width:1.5;rx:14;filter:url(#shadow)}.blue{fill:#edf6ff;stroke:#4b92dc}.green{fill:#effaf5;stroke:#54aa80}.amber{fill:#fff8e8;stroke:#d6a742}.title{font:700 21px Arial,sans-serif;fill:#102f4c}.sub{font:400 15px Arial,sans-serif;fill:#587087}.mini{font:700 12px Arial,sans-serif;letter-spacing:1px;fill:#2875c7}.flow{fill:none;stroke:#52708c;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#8ba2b6;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1000" fill="#f5f8fa"/><rect width="1800" height="1000" fill="url(#grid)" opacity=".48"/>

  <!-- configuration inputs -->
  <rect class="group" x="35" y="55" width="420" height="890"/>
  <text class="tag" x="70" y="100">01 / SOURCE INFORMATION</text>
  <g transform="translate(70 145)"><rect class="node" width="350" height="125"/><text class="mini" x="25" y="34">DOCUMENTED PROCESS</text><text class="title" x="25" y="68">Procedure documentation</text><text class="sub" x="25" y="96">Required steps and expected outcome</text></g>
  <g transform="translate(70 305)"><rect class="node" width="350" height="125"/><text class="mini" x="25" y="34">QUALITY REQUIREMENTS</text><text class="title" x="25" y="68">L1 checklist · 22 rules</text><text class="sub" x="25" y="96">Checks, gates and acceptance criteria</text></g>
  <g transform="translate(70 465)"><rect class="node" width="350" height="125"/><text class="mini" x="25" y="34">CLASSIFICATION DATA</text><text class="title" x="25" y="68">Uniclass + BSGD sources</text><text class="sub" x="25" y="96">Codes, mappings and reference values</text></g>
  <g transform="translate(70 625)"><rect class="node" width="350" height="125"/><text class="mini" x="25" y="34">MODEL IMPROVEMENT</text><text class="title" x="25" y="68">Approved update rules</text><text class="sub" x="25" y="96">Parameters and details allowed to change</text></g>
  <g transform="translate(70 805)"><rect class="blue" x="0" y="0" width="350" height="92" rx="14"/><text class="mini" x="25" y="31">VERSIONED SOURCE OF TRUTH</text><text class="title" x="25" y="64">Rules + mappings catalogue</text></g>
  <path class="dash" d="M245 270V300"/><path class="dash" d="M245 430V460"/><path class="dash" d="M245 590V620"/><path class="flow" d="M245 750V800"/>

  <!-- plugin implementation -->
  <rect class="group" x="500" y="55" width="455" height="890"/>
  <text class="tag" x="535" y="100">02 / REVIT ADD-IN</text>
  <g transform="translate(545 165)"><rect class="blue" width="365" height="155" rx="14" filter="url(#shadow)"/><text class="mini" x="28" y="38">RULE CONFIGURATION</text><text class="title" x="28" y="76">Encode checks, mappings</text><text class="title" x="28" y="103">and update actions</text><text class="sub" x="28" y="132">Validation and write actions stay separate</text></g>
  <g transform="translate(545 380)"><rect class="node" width="365" height="155"/><text class="mini" x="28" y="38">IMPLEMENTATION</text><text class="title" x="28" y="76">C# / .NET + Revit API</text><text class="sub" x="28" y="106">IExternalCommand entry point</text><text class="sub" x="28" y="132">Claude + VS Code support development</text></g>
  <g transform="translate(545 600)"><rect class="node" width="365" height="140"/><text class="mini" x="28" y="38">PACKAGE + REGISTER</text><text class="title" x="28" y="77">Add-in DLL + .addin manifest</text><text class="sub" x="28" y="108">Loaded by Autodesk Revit</text></g>
  <g transform="translate(545 805)"><rect class="green" width="365" height="92" rx="14"/><circle cx="45" cy="46" r="17" fill="#3ba66e"/><path d="M36 46l7 7 13-16" fill="none" stroke="#fff" stroke-width="4"/><text class="title" x="78" y="42">Self-certification plugin</text><text class="sub" x="78" y="67">Ready inside Revit</text></g>
  <path class="flow" d="M420 851H540"/><path class="flow" d="M728 320V375"/><path class="flow" d="M728 535V595"/><path class="flow" d="M728 740V800"/>

  <!-- runtime -->
  <rect class="group" x="1000" y="55" width="765" height="890"/>
  <text class="tag" x="1035" y="100">03 / MODEL PROCEDURE</text>
  <g transform="translate(1040 145)"><rect class="node" width="300" height="125"/><text class="mini" x="24" y="34">INPUT</text><text class="title" x="24" y="69">Open Revit model</text><text class="sub" x="24" y="98">User starts the plugin command</text></g>
  <g transform="translate(1425 145)"><rect class="node" width="300" height="125"/><text class="mini" x="24" y="34">READ</text><text class="title" x="24" y="69">Collect model data</text><text class="sub" x="24" y="98">Elements, types and parameters</text></g>
  <path class="flow" d="M1340 208H1420"/>

  <g transform="translate(1040 340)"><rect class="blue" width="685" height="145" rx="14" filter="url(#shadow)"/><text class="mini" x="26" y="35">RULE ENGINE</text><text class="title" x="26" y="72">Classify data · evaluate 22 rules · group five quality gates</text><text class="sub" x="26" y="105">Compare model values with the checklist, Uniclass / BSGD mappings and project rules</text><text class="sub" x="26" y="128">Produce pass, issue and update-candidate results</text></g>
  <path class="flow" d="M1575 270V310H1383V335"/>

  <g transform="translate(1040 555)"><rect class="amber" width="300" height="140" rx="14" filter="url(#shadow)"/><text class="mini" x="24" y="35">CONTROL</text><text class="title" x="24" y="72">Review update actions</text><text class="sub" x="24" y="102">Confirm permitted parameter and</text><text class="sub" x="24" y="124">classification updates</text></g>
  <g transform="translate(1425 555)"><rect class="amber" width="300" height="140" rx="14" filter="url(#shadow)"/><text class="mini" x="24" y="35">WRITE</text><text class="title" x="24" y="72">Apply model updates</text><text class="sub" x="24" y="102">Commit changes in a Revit API</text><text class="sub" x="24" y="124">transaction</text></g>
  <path class="flow" d="M1383 485V520H1190V550"/><path class="flow" d="M1340 625H1420"/>

  <g transform="translate(1040 780)"><rect class="green" width="300" height="120" rx="14"/><text class="mini" x="24" y="33">VERIFY</text><text class="title" x="24" y="68">Re-check five gates</text><text class="sub" x="24" y="96">Confirm the updated model state</text></g>
  <g transform="translate(1425 780)"><rect class="green" width="300" height="120" rx="14"/><text class="mini" x="24" y="33">OUTPUT</text><text class="title" x="24" y="68">Certification record</text><text class="sub" x="24" y="96">Results, changes and audit trail</text></g>
  <path class="flow" d="M1575 695V735H1190V775"/><path class="flow" d="M1340 840H1420"/>
  <path class="flow" d="M910 851H975V208H1035"/>
</svg>
