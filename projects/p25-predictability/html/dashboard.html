<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>P25 → H10 — Lessons learned, BIM model, BOQ and H10 implementation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --violet-300:#A89BFF;--violet-400:#8A77FF;--violet-500:#7C5CFF;--violet-600:#6748E8;
  --cyan-400:#3DE0FF;--cyan-500:#00D4FF;--emerald-400:#22E6A8;--emerald-500:#10C28B;
  --amber-400:#FFC34D;--amber-500:#FFB020;--rose-400:#FF6B85;--rose-500:#FF4D6D;--pink-500:#FF6FB1;
  --grad-primary:linear-gradient(135deg,#7C5CFF 0%,#00D4FF 100%);
  --grad-warm:linear-gradient(135deg,#FF6FB1 0%,#FFB020 100%);
  --grad-cool:linear-gradient(135deg,#22E6A8 0%,#00D4FF 100%);
  --grad-danger:linear-gradient(135deg,#FF4D6D 0%,#FF6FB1 100%);
  --r-xs:6px;--r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;--r-full:999px;
  --t-fast:160ms;--t-med:220ms;--t-slow:320ms;
  --ease:cubic-bezier(.22,.61,.36,1);--ease-out:cubic-bezier(.16,1,.3,1);
  --f-sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
:root,[data-theme="light"]{
  --bg:#F4F6FC;--bg-2:#ECEFF8;--surface:#FFFFFF;--surface-2:#F7F8FE;--surface-3:#EFF2FB;
  --line:rgba(10,14,31,.06);--line-2:rgba(10,14,31,.10);
  --text:#0A0E1F;--text-2:#3E465F;--text-3:#6B7390;--muted:#8A92AB;--glass:rgba(10,14,31,.02);
  --glow:rgba(124,92,255,.20);
  --shadow-card:0 1px 0 rgba(10,14,31,.02) inset,0 6px 18px -10px rgba(10,14,31,.12);
  --shadow-hover:0 1px 0 rgba(10,14,31,.03) inset,0 16px 40px -16px rgba(10,14,31,.20),0 0 0 1px rgba(124,92,255,.20);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0A0D18;--bg-2:#0F1424;--surface:#141A2E;--surface-2:#1A2138;--surface-3:#232C48;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --text:#F1F4FA;--text-2:#B7BFD6;--text-3:#7C849F;--muted:#5A6280;--glass:rgba(255,255,255,.04);
  --glow:rgba(124,92,255,.35);
  --shadow-card:0 1px 0 rgba(255,255,255,.05) inset,0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-hover:0 1px 0 rgba(255,255,255,.08) inset,0 18px 40px -16px rgba(0,0,0,.7),0 0 0 1px rgba(124,92,255,.18);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--f-sans);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);
  font-feature-settings:'ss01','cv11','tnum';-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
a{color:inherit;text-decoration:none;}
.num{font-variant-numeric:tabular-nums;}
[hidden]{display:none !important;}
::selection{background:var(--violet-500);color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);}

/* brand */
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 4px;}
.brand-asure{height:24px;width:auto;display:block;}
[data-theme="dark"] .brand-asure{filter:brightness(0) invert(1);}
.brand-x{color:var(--text-3);font-size:11px;font-weight:700;letter-spacing:.14em;}
.brand-phoenix{height:18px;width:auto;display:block;opacity:.85;}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100dvh;background:var(--bg);}
.sidebar{position:sticky;top:0;height:100dvh;padding:18px 14px;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:14px;overflow:auto;}
.proj-switch{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);}
.proj-thumb{width:38px;height:38px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,#1a1f3a,#0a0d18);border:1px solid var(--line-2);overflow:hidden;}
.proj-thumb img{width:80%;height:80%;object-fit:contain;filter:brightness(0) invert(1);}
.proj-meta{display:grid;flex:1;min-width:0;}
.proj-name{font-weight:700;}
.proj-sub{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav{display:grid;gap:2px;margin-top:6px;}
.nav-group{padding:14px 12px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--text-2);position:relative;width:100%;text-align:left;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);}
.nav-item:hover{background:var(--glass);color:var(--text);}
.nav-item svg{flex:none;opacity:.8;}
.nav-item .nav-tag{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:var(--r-full);background:var(--surface-3);color:var(--text-2);}
.nav-item.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line-2);}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:var(--grad-primary);border-radius:0 4px 4px 0;}
.nav-item.active svg{opacity:1;color:var(--violet-500);}
.sidebar-foot{margin-top:auto;padding:8px;}
.health-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--line);font-size:11.5px;color:var(--text-2);}
.dot{width:7px;height:7px;border-radius:50%;flex:none;}
.dot-good{background:var(--emerald-400);box-shadow:0 0 0 3px rgba(34,230,168,.18);}
.dot-warn{background:var(--amber-400);box-shadow:0 0 0 3px rgba(255,176,32,.18);}
.dot-bad{background:var(--rose-400);box-shadow:0 0 0 3px rgba(255,77,109,.18);}

/* topbar */
.main{min-width:0;}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 24px;
  background:color-mix(in oklab,var(--bg) 80%,transparent);backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid var(--line);}
.crumbs{font-size:13.5px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
.crumbs .sep{color:var(--text-3);}
.crumbs .here{color:var(--text);}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px;}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);color:var(--text-2);
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn:active{transform:scale(.96);}
.i-sun,.i-moon{display:none;}
[data-theme="dark"] .i-sun{display:block;}
[data-theme="light"] .i-moon{display:block;}
.chip-100{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-full);font-size:12px;font-weight:700;
  color:var(--emerald-500);background:rgba(34,230,168,.08);border:1px solid rgba(34,230,168,.22);}

/* view */
.view{padding:24px;outline:none;max-width:1300px;}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;}
.view-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;}
.view-sub{color:var(--text-2);margin:4px 0 0;font-size:13.5px;max-width:90ch;}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:24px;
  background:radial-gradient(40rem 24rem at 90% -10%,rgba(0,212,255,.18),transparent 60%),
    radial-gradient(36rem 22rem at -10% 120%,rgba(124,92,255,.22),transparent 60%),
    linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--line);box-shadow:var(--shadow-card);}
.hero-row{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center;}
@media (max-width:980px){.hero-row{grid-template-columns:1fr;}}
.hero-eyebrow{display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:12.5px;font-weight:600;}
.hero-eyebrow .dot{width:8px;height:8px;}
.hero-title{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.16;margin:12px 0 0;}
.hero-title .grad{background:var(--grad-primary);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{color:var(--text-2);margin:10px 0 0;max-width:60ch;}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;}
.hero-stat .k{font-size:24px;font-weight:800;letter-spacing:-.02em;}
.hero-stat .l{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);}
.ring{width:190px;height:190px;transform:rotate(-90deg);}
.ring .track{stroke:var(--surface-3);}
.ring .fill{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease-out);}
.ring-cap{text-align:center;}
.ring-cap .pct{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1;}
.ring-cap .lab{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:4px;max-width:220px;}

/* grid + cards */
.grid{display:grid;gap:16px;margin-top:20px;}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media (max-width:980px){.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-card);
  transition:transform var(--t-med) var(--ease-out),box-shadow var(--t-med) var(--ease-out),border-color var(--t-med) var(--ease-out);}
.card.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--line-2);}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.card-title{font-size:13.5px;font-weight:700;}
.card-title small{color:var(--text-3);font-weight:500;margin-left:6px;}

/* kpi */
.kpi .big{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1;}
.kpi .lab{color:var(--text-3);font-size:12px;margin-top:8px;}
.kpi .sub{color:var(--text-2);font-size:12.5px;margin-top:6px;}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--r-full);font-size:11.5px;font-weight:700;
  background:var(--surface-3);color:var(--text-2);border:1px solid var(--line);}
.chip .dot{width:6px;height:6px;box-shadow:none;}
.chip-good{color:var(--emerald-500);background:rgba(34,230,168,.08);border-color:rgba(34,230,168,.18);}
.chip-warn{color:var(--amber-500);background:rgba(255,176,32,.08);border-color:rgba(255,176,32,.18);}
.chip-bad{color:var(--rose-500);background:rgba(255,77,109,.08);border-color:rgba(255,77,109,.18);}
.chip-info{color:var(--cyan-500);background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.18);}
.chip-violet{color:var(--violet-500);background:rgba(124,92,255,.10);border-color:rgba(124,92,255,.20);}

/* bars */
.bar-row{display:grid;grid-template-columns:200px 1fr 70px;align-items:center;gap:12px;padding:7px 0;font-size:12.5px;}
.bar-row .blab{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad-primary);width:0;transition:width 1s var(--ease-out);}
.bar.warm>i{background:var(--grad-warm);}
.bar.cool>i{background:var(--grad-cool);}
.bar.danger>i{background:var(--grad-danger);}
.bar.violet>i{background:linear-gradient(90deg,var(--violet-500),var(--violet-400));}
.bar-row .bval{text-align:right;font-variant-numeric:tabular-nums;color:var(--text);font-weight:700;}

/* segmented stacked bar */
.stack-bar{display:flex;height:34px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);}
.stack-bar > span{display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#0A0E1F;transition:flex 1s var(--ease-out);}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--text-2);}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:6px;vertical-align:-1px;}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.donut{width:160px;height:160px;transform:rotate(-90deg);flex:none;}

/* table */
.table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;}
.table th,.table td{padding:11px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--line);vertical-align:top;}
.table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:700;background:var(--surface-2);}
.table tr:last-child td{border-bottom:0;}
.table tbody tr{transition:background var(--t-fast) var(--ease);}
.table tbody tr:hover{background:var(--glass);}
.table .mono{font-family:var(--f-mono);font-size:12px;color:var(--violet-500);font-weight:600;}
.table .nright{text-align:right;font-variant-numeric:tabular-nums;}

/* notes */
.note{font-size:12px;color:var(--text-3);margin-top:12px;line-height:1.6;}
.src{font-family:var(--f-mono);font-size:11px;color:var(--text-3);}
ul.tight{margin:6px 0 0;padding-left:18px;color:var(--text-2);}
ul.tight li{margin:4px 0;}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-full);font-size:11.5px;font-weight:700;letter-spacing:.02em;
  background:var(--surface-3);color:var(--text-2);border:1px solid var(--line);}
.pill.req{color:var(--amber-500);background:rgba(255,176,32,.10);border-color:rgba(255,176,32,.22);}
.pill.ok{color:var(--emerald-500);background:rgba(34,230,168,.10);border-color:rgba(34,230,168,.22);}

/* maturity ladder */
.ladder{display:grid;gap:8px;}
.rung{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;padding:10px 12px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--line);}
.rung .lv{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:var(--surface-3);}
.rung.gfc .lv{background:var(--grad-warm);}
.rung.bill .lv{background:var(--grad-primary);}
.rung .rtitle{font-weight:700;font-size:13px;}
.rung .rsub{font-size:11.5px;color:var(--text-3);margin-top:1px;}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;}}
:focus-visible{outline:2px solid var(--violet-400);outline-offset:2px;border-radius:6px;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#00D4FF"/></linearGradient>
</defs></svg>

<main class="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-asure" id="logoAsure" alt="asure" />
      <span class="brand-x">×</span>
      <img class="brand-phoenix" id="logoPhoenixBrand" alt="Phoenix" />
    </div>

    <div class="proj-switch">
      <span class="proj-thumb"><img id="logoPhoenixThumb" alt="" /></span>
      <span class="proj-meta">
        <span class="proj-name">Phoenix P25 → H10</span>
        <span class="proj-sub">Lessons learned · implementation</span>
      </span>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-group">P25 lessons</div>
      <button class="nav-item active" data-view="overview">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Overview
      </button>
      <button class="nav-item" data-view="acc">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        RFI &amp; ACC
        <span class="nav-tag">64</span>
      </button>
      <button class="nav-item" data-view="boq">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        BOQ data
        <span class="nav-tag">40</span>
      </button>
      <button class="nav-item" data-view="rnr">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>
        R&amp;R / variations
        <span class="nav-tag">59</span>
      </button>
      <button class="nav-item" data-view="bim">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        BIM model
      </button>
      <div class="nav-group">H10 implementation</div>
      <button class="nav-item" data-view="h10">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        H10 process
      </button>
      <button class="nav-item" data-view="timefin">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Time &amp; finance
      </button>
      <button class="nav-item" data-view="lessons">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
        Lessons learned
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="health-pill"><span class="dot dot-good"></span><span>Source-verified · 82 H10 files</span></div>
    </div>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="crumbs"><span>Phoenix P25 → H10</span><span class="sep">/</span><span class="here" id="crumbHere">Overview</span></div>
      <div class="topbar-actions">

      <tr><td>Fire-rated glazing carried in BOQ for 39 days after descope</td><td>Scope changes not propagated to the BOQ in the same revision cycle</td><td>BOQ readiness score ≥95% required at GFC; held below threshold</td></tr>
    </tbody></table>
  </div></div>

  <div class="grid"><div class="card lift">
    <div class="card-head"><div class="card-title">From the RFI and ACC record</div></div>
    <table class="table"><thead><tr><th>P25 evidence</th><th>What was missing</th><th>H10 prevention</th></tr></thead><tbody>

      <tr><td>Fire-protection package raised 39 of 64 RFIs (61%)</td><td>Builders-work opening attribute missing on structure</td><td>CD-05 to CD-09 clash matrix; sleeve and penetration approvals through ABKJ</td></tr>
      <tr><td>45% of register entries unnumbered; 3 contractor-code collisions</td><td>No single numbering authority</td><td>7-field container ID with ACC auto-rejection of non-compliant names</td></tr>
      <tr><td>5.0 mean ball-in-court bounces per RFI; 323 total; max 12</td><td>No routing matrix per question class</td><td>Open → In Progress → Resolved → Verified (DTIM only); SLA per priority</td></tr>
      <tr><td>One demo RFI carried 141 days on the books</td><td>Test items not quarantined</td><td>Demo / test issue type with auto-purge</td></tr>
    </tbody></table>
  </div></div>

  <div class="grid"><div class="card lift">
    <div class="card-head"><div class="card-title">From R&amp;R and variations</div></div>
    <table class="table"><thead><tr><th>P25 evidence</th><th>What was missing</th><th>H10 prevention</th></tr></thead><tbody>
      <tr><td>76% of 127 folder-era RFI enclosures carry BOQ / quantity / cost content</td><td>RFI channel was carrying commercial reconciliation, not design questions</td><td>Separate quantity-reconciliation register; quantities derived from the model</td></tr>
      <tr><td>RFI-214 (MEP) = ₹7,56,501; RFI-049 (STR) = ₹18,12,331; RFI-327 (MEP) 50 vs 49 flanges; RFI-153 (PHE) workbook</td><td>Manual GFC-vs-BOQ quantity derivation, repeated at every revision</td><td>Schedule diff (Revision N vs N-1) × classification tag × BOQ rate row → variation amount, automatically</td></tr>
      <tr><td>TMT steel +700 MT BOQ amendment cycled for months between L&amp;T and WTP</td><td>Tonnage change tracked outside the model</td><td>Weight (MT) as a model parameter; reconciliation per revision</td></tr>
      <tr><td>2,275 m² basement-area trade quantified inside a MOM, not a cost instrument</td><td>Commercial decisions logged in minutes</td><td>Decisions logged in ACC Build / Revizto with deadline and DTIM verification</td></tr>
    </tbody></table>
  </div></div>

  <div class="grid"><div class="card lift">
    <div class="card-head"><div class="card-title">From the LOT / MAR approval record</div></div>
    <table class="table"><thead><tr><th>P25 evidence</th><th>What was missing</th><th>H10 prevention</th></tr></thead><tbody>
      <tr><td>338 LOT/MAR enclosures (LOT-001 to LOT-916) on 5 disconnected Excel trackers</td><td>No single submittal register</td><td>LOT routed in ACC with the four-verdict workflow gated</td></tr>
      <tr><td>Verdict set in folder names (85 Approved / 31 with comments / 23 Rejected / 20 R&amp;R) but not system-enforced</td><td>Verdicts depended on folder naming</td><td>Suitability ladder S0-S5 → A1/A2 enforced by ACC</td></tr>
      <tr><td>26 of 338 LOTs were clash or "Model-vs-GFC missing-details" logs</td><td>Coordination findings carried via LOT, not a clash issue type</td><td>Critical 7-day fix; clash issue type with assignment by 12:00 Friday</td></tr>
    </tbody></table>
  </div></div>

  <div class="grid"><div class="card lift">
    <div class="card-head"><div class="card-title">From MOMs and NCRs</div></div>
    <table class="table"><thead><tr><th>P25 evidence</th><th>What was missing</th><th>H10 prevention</th></tr></thead><tbody>

`;

/* ===== helpers ===== */
function kpi(big,lab,sub){
  return `<div class="card lift"><div class="kpi"><div class="big num">${big}</div></div>
    <div class="lab">${lab}</div><div class="sub">${sub}</div></div>`;
}
function barList(rows,max,cls){
  return rows.map(([lab,val])=>{
    const w=Math.round(val/max*100);
    const disp=typeof val==='number'?val.toLocaleString():val;
    return `<div class="bar-row"><span class="blab">${lab}</span><div class="bar ${cls||'violet'}"><i data-w="${w}"></i></div><span class="bval num">${disp}</span></div>`;
  }).join('');
}
function renderDonut(){
  const el=document.getElementById('rfiDonut'); if(!el) return;
  const data=[[19,'#FF4D6D'],[36,'#FFB020'],[9,'#22E6A8']];
  const total=64,R=46,C=2*Math.PI*R; let off=0,html='';
  data.forEach(([v,col])=>{const len=v/total*C;
    html+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off+=len;});
  el.innerHTML=html; el.style.transform='none';
}
function ladder(){
  const rows=[
    ['0','Fragmented','data in folders / inboxes / spreadsheets',''],
    ['1','Recorded','data captured but not classified',''],
    ['2','Classified','model carries classification tag','gfc'],
    ['3','Reconciled','model and BOQ reconciled per revision','bill'],
    ['4','Federated','federated model, live dashboards',''],
  ];
  return `<div class="ladder">${rows.map(([lv,t,s,c])=>`
    <div class="rung ${c}"><div class="lv">${lv}</div>
      <div><div class="rtitle">${t}${c==='gfc'?' &nbsp;<span class="chip chip-warn" style="vertical-align:1px">GFC target</span>':''}${c==='bill'?' &nbsp;<span class="chip chip-violet" style="vertical-align:1px">first-billing target</span>':''}</div><div class="rsub">${s}</div></div>
    </div>`).join('')}</div>`;
}

function setView(name){
  document.getElementById('view').innerHTML = VIEWS[name]();
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
  document.getElementById('crumbHere').textContent = ({overview:'Overview',acc:'RFI & ACC',boq:'BOQ data',rnr:'R&R / Variations',bim:'BIM model',h10:'H10 implementation',timefin:'Time & finance',lessons:'Lessons learned'})[name];
  window.scrollTo(0,0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const pb=document.getElementById('paretoBars');
    if(pb) pb.innerHTML = barList([
      ['Coordination clash',27],['Missing design info',10],['Material/finish',7],['BOQ–drawing mismatch',7],
      ['Drawing–spec inconsistency',4],['Site variance',4],['Other',3],['Execution method',2]
    ], 27, 'danger');
    const pm=document.getElementById('paretoMonths');
    if(pm) pm.innerHTML = barList([
      ['Dec 2025',5],['Jan 2026',32],['Feb 2026',7],['Mar 2026',5],['Apr 2026',10],['May 2026',5]
    ], 32, 'violet');
    const db=document.getElementById('discBars');
    if(db) db.innerHTML = barList([
      ['Fire protection (HSS)',39],['Façade (Alufit)',10],['Electrical (PIS)',8],['Quality (CQRA)',4],['Client / demo',2],['Blockwork',1]
    ], 39, 'warm');
    const eb=document.getElementById('discElemBars');
    if(eb) eb.innerHTML = barList([
      ['Fire-fighting',304380],['Architecture',139093],['Structure',136543],['Plumbing-PHE',113007],
      ['Façade',56408],['HVAC',56066],['Electrical',30297],['Landscape',4647],['ELV-Security',1752]
    ], 304380, 'violet');
    document.querySelectorAll('.bar > i[data-w]').forEach(i=>{ i.style.width=i.dataset.w+'%'; });
    const hr=document.getElementById('heroRing');
    if(hr){ const C=540.4; hr.style.strokeDashoffset=String(C*(1-0.86)); }
    renderDonut();
  }));
}
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.getElementById('themeToggle').addEventListener('click',()=>{
  const r=document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme')==='dark'?'light':'dark');
});
setView('overview');
</script>
