<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Phoenix H10 · Project + BIM Progress</title>
<style>
  :root{
    --a1:#7C5CFF; --a2:#00D4FF; --grad:linear-gradient(135deg,#7C5CFF,#00D4FF);
    --good:#1Fae82; --warn:#C98A00; --bad:#E0556E; --violet:#7C5CFF;
    --f:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    --side:248px; --rail:316px;
    --r-sm:9px; --r-md:12px; --r-lg:16px; --r-xl:22px; --sp:8px;
    --ease:cubic-bezier(.23,1,.32,1);
  }
  [data-theme="light"]{
    --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#FBFCFE; --inset:#F1F3FA;
    --text:#10142A; --text-2:#444C66; --text-3:#717991; --muted:#9AA1B6;
    --line:rgba(16,20,42,.07); --line-2:rgba(16,20,42,.12); --track:#EBEEF6;
    --lift:0 0 0 1px rgba(16,20,42,.05),0 1px 2px -1px rgba(16,20,42,.08),0 4px 12px -6px rgba(16,20,42,.10);
    --lift-2:0 0 0 1px rgba(16,20,42,.06),0 2px 6px -2px rgba(16,20,42,.10),0 14px 30px -12px rgba(16,20,42,.18);
    color-scheme:light;
  }
  [data-theme="dark"]{
    --bg:#0A0D18; --surface:#121728; --surface-2:#161C30; --inset:#0E1322;
    --text:#EEF1F8; --text-2:#AEB6CE; --text-3:#7C849F; --muted:#5A6280;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14); --track:rgba(255,255,255,.08);
    --lift:0 0 0 1px rgba(255,255,255,.07); --lift-2:0 0 0 1px rgba(255,255,255,.12);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--f);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
  h1,h2,h3,h4,p{margin:0}
  .num{font-variant-numeric:tabular-nums}
  a{color:var(--a1);text-decoration:none}

  .layout{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
  .content{display:grid;grid-template-columns:1fr var(--rail)}

  /* sidebar */
  .side{background:var(--bg);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 14px}
  .brand .mk{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800}
  .brand b{font-size:14px}.brand small{display:block;color:var(--text-3);font-size:11px}
  .ngroup{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px}
  .nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 11px;border-radius:var(--r-sm);color:var(--text-2);font-size:13.5px;font-weight:500;background:none;border:0;cursor:pointer;font-family:inherit}
  .nav:hover{background:var(--surface)}
  .nav.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--lift)}
  .nav.active .ic{color:var(--a1)}
  .nav .ic{width:17px;text-align:center;font-size:14px;color:var(--text-3)}
  .nav .soon{margin-left:auto;font-size:9px;font-weight:700;color:var(--muted);background:var(--inset);padding:2px 7px;border-radius:999px}
  .nav:disabled{opacity:.8;cursor:default}

  .main{padding:24px 30px 60px;min-width:0}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px}
  .top h1{font-size:25px;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
  .top .sub{color:var(--text-3);font-size:13px;margin-top:5px}
  .acts{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .lodhi{color:var(--a1);font-weight:700;background:rgba(124,92,255,.12);padding:1px 8px;border-radius:6px}
  [data-theme="dark"] .lodhi{color:#B9A8FF}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:var(--r-sm);font:inherit;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--text);cursor:pointer;box-shadow:var(--lift)}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px rgba(124,92,255,.6)}
  .icon-btn{width:38px;height:38px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:15px;box-shadow:var(--lift)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--inset);color:var(--text-3);border:1px solid var(--line)}
  .pill.warn{color:var(--warn);background:rgba(201,138,0,.10);border-color:rgba(201,138,0,.24)}

  /* signed-in user */
  .user{display:flex;align-items:center;gap:9px;padding:5px 13px 5px 5px;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--lift)}
  .user .uav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
  .user .un{font-size:12.5px;font-weight:600;line-height:1.15}
  .user .ur{font-size:10.5px;color:var(--text-3)}
  @media(max-width:560px){.user .um{display:none}}

  .grid{display:grid;gap:16px}
  .auto{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .auto-sm{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--lift)}
  .card.pad{padding:20px}

  /* highlighted section header */
  .sec{display:flex;align-items:center;gap:11px;margin:32px 2px 14px}
  .sec .bar{width:5px;height:18px;border-radius:3px;background:var(--grad)}
  .sec .t{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text)}
  .sec .src{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--text-3);background:var(--inset);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
  /* big divider header for the BIM zone */
  .zone{display:flex;align-items:center;gap:13px;margin:40px 2px 6px}
  .zone .zt{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--text)}
  .zone .zl{flex:1;height:1px;background:var(--line-2)}
  .zone .zsrc{font-size:10.5px;font-weight:600;color:var(--text-3)}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
  .chip.g{color:var(--good);background:rgba(31,174,130,.10);border-color:rgba(31,174,130,.22)}
  .chip.w{color:var(--warn);background:rgba(201,138,0,.12);border-color:rgba(201,138,0,.26)}
  .chip.b{color:var(--bad);background:rgba(224,85,110,.10);border-color:rgba(224,85,110,.22)}
  [data-theme="dark"] .chip.w{color:#FFC34D}

  /* rings */
  .ring{position:relative;display:grid;place-items:center}
  .ring svg{transform:rotate(-90deg)}
  .ring .tk{stroke:var(--track)}
  .ring .fl{stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease)}
  .ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
  .ring .lbl .v{font-weight:700;letter-spacing:-.02em}
  .ring .lbl .t{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin-top:3px}

  /* logos */
  .logo{background:#FFFFFF;border:1px solid var(--line-2);border-radius:12px;display:grid;place-items:center;flex-shrink:0;box-shadow:var(--lift)}
  .logo svg{display:block}
  .tile{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex-shrink:0;box-shadow:var(--lift)}

  /* project outline */
  .outline{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(180px,1fr) minmax(240px,1.4fr);gap:16px}
  .media{border:1.5px dashed var(--line-2);border-radius:var(--r-md);background:var(--inset);display:grid;place-items:center;text-align:center;color:var(--text-3);min-height:158px;overflow:hidden;position:relative}
  .media img{width:100%;height:100%;object-fit:cover}
  .media .mi{font-size:26px}
  .media .mt{font-size:12px;font-weight:600;margin-top:6px;color:var(--text-2)}
  .media .ms{font-size:10.5px;color:var(--muted);margin-top:2px}
  .mapwrap{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:var(--r-md);overflow:hidden;background:var(--inset);min-height:158px}
  .gmap{width:100%;flex:1;min-height:120px;border:0;display:block}
  .mapcap{padding:8px 11px;font-size:11.5px;font-weight:600;color:var(--text-2);border-top:1px solid var(--line);background:var(--surface)}
  .mapcap .mc-co{font-size:10px;font-weight:600;color:var(--text-3);margin-top:3px}
  .mapcap .mc-src{font-size:9.5px;color:var(--muted);margin-top:1px}
  /* greeting + breadcrumb */
  .crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3);margin-bottom:14px}
  .crumb b{color:var(--text-2);font-weight:600}
  .greet{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .greet-sub{color:var(--text-3);font-size:13px;margin-top:5px}
  /* hero */
  .hero{display:grid;grid-template-columns:1.35fr .9fr;border:1px solid var(--line-2);border-radius:var(--r-xl);overflow:hidden;background:linear-gradient(135deg,rgba(124,92,255,.12),rgba(0,212,255,.06));box-shadow:var(--lift)}
  .hero .hl{padding:26px 28px}
  .hero .hpill{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .hero h2{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.06;text-wrap:balance}
  .hero h2 .hi{color:var(--a1)}
  [data-theme="dark"] .hero h2 .hi{color:#B9A8FF}
  .hero .hdesc{color:var(--text-2);font-size:13px;margin-top:11px;line-height:1.55;max-width:54ch}
  .hero .hstats{display:flex;flex-wrap:wrap;gap:14px 30px;margin-top:22px}
  .hero .hs .hv{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .hero .hs .hk{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-top:2px}
  .hero .hr{position:relative;min-height:230px;background:var(--inset)}
  .hero .hr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero .hmeta{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3);line-height:1.7}
  /* combined top box */
  .topbox{overflow:hidden;padding:0}
  .hero2{display:grid;grid-template-columns:1.35fr .8fr;background:linear-gradient(135deg,rgba(124,92,255,.10),rgba(0,212,255,.05))}
  .hero2 .hl2{padding:20px 24px 22px}
  .h2b{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.06;text-wrap:balance}
  .hero2 .hr2{position:relative;min-height:200px;background:var(--inset)}
  .hero2 .hr2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hpill{display:flex;gap:8px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
  .hdesc{color:var(--text-2);font-size:13px;margin-top:9px;line-height:1.5;max-width:52ch}
  .hi{color:var(--a1)}
  [data-theme="dark"] .hi{color:#B9A8FF}
  .hstats{display:flex;flex-wrap:wrap;gap:12px 30px;margin-top:18px}
  .hs .hv{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .hs .hk{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-top:2px}
  .lower2{display:grid;grid-template-columns:1.35fr .9fr;border-top:1px solid var(--line)}
  .linfo{padding:14px 22px;border-right:1px solid var(--line)}
  .linfo .orow{padding:5px 2px;font-size:12px}
  .lhead{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:5px}
  .lmap{padding:14px;display:flex}
  .lmap .mapwrap{flex:1;min-height:150}
  .lmap .gmap{min-height:108}
  .lmap .mapcap{padding:6px 9px}
  @media(max-width:820px){.hero2{grid-template-columns:1fr}.hero2 .hr2{min-height:160px;order:-1}.lower2{grid-template-columns:1fr}.linfo{border-right:0;border-bottom:1px solid var(--line)}}
  @media(max-width:820px){.hero{grid-template-columns:1fr}.hero .hr{min-height:180px;order:-1}.loc{grid-template-columns:1fr!important}}
  /* single-line timeline */
  .tl{position:relative;margin:8px 8px 4px}
  .tl-line{position:absolute;left:0;right:0;height:3px;background:var(--track);border-radius:3px}
  .tl-fill{position:absolute;left:0;height:3px;background:var(--grad);border-radius:3px}
  .tl-tick{position:absolute;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--text-3)}
  .tl-dot{position:absolute;width:13px;height:13px;border-radius:50%;border:3px solid var(--surface);box-shadow:var(--lift);transform:translate(-50%,-50%);z-index:2}
  .tl-conn{position:absolute;width:1.5px;background:var(--line-2);transform:translateX(-50%);z-index:1}
  .tl-lab{position:absolute;transform:translateX(-50%);width:104px;text-align:center;z-index:2}
  .tl-lab .tl-nm{font-size:10.5px;font-weight:600;line-height:1.2;color:var(--text)}
  .tl-lab .tl-dt{font-size:9.5px;color:var(--text-3);margin-top:1px}
  .tl-today{position:absolute;width:2px;background:rgba(124,92,255,.32);transform:translateX(-50%);z-index:1}
  .tl-tpl{position:absolute;transform:translateX(-50%);background:var(--grad);color:#fff;font-size:8.5px;font-weight:800;letter-spacing:.05em;padding:1px 6px;border-radius:999px;white-space:nowrap;z-index:4}
  /* param table */
  .ptbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .ptbl th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:0 10px 8px;border-bottom:1px solid var(--line-2)}
  .ptbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .ptbl td.pn{font-weight:700;color:var(--a1);white-space:nowrap}
  [data-theme="dark"] .ptbl td.pn{color:#B9A8FF}
  .ptbl td.pf{color:var(--text-3)}
  @media(max-width:600px){.ptbl .hideM{display:none}}
  .oname{font-weight:700;font-size:15.5px;margin-bottom:8px}
  .orow{display:flex;justify-content:space-between;gap:12px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
  .orow:last-child{border-bottom:0}
  .orow .k{color:var(--text-3)} .orow .v{font-weight:600;text-align:right}
  @media(max-width:900px){.outline{grid-template-columns:1fr}}

  /* project overview */
  .ov{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
  .ov .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
  .ov .st{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2)}
  .ov .st .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
  .ov .st .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
  .ov .st .src{font-size:10px;color:var(--muted)}
  .ov .hero-meta{text-align:center;margin-top:8px}
  .ov .hero-meta .l{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
  @media(max-width:640px){.ov{grid-template-columns:1fr;justify-items:center}}

  /* gfc */
  .gfc{display:grid;grid-template-columns:280px 1fr;gap:6px;align-items:center}
  .gfc .hero{padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;border-right:1px solid var(--line)}
  .gfc .hm{text-align:center}
  .gfc .hm .l{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
  .gfc .hm .d{font-size:18px;font-weight:700;margin-top:4px}
  .gfc .hm .r{font-size:12.5px;color:var(--text-2);margin-top:2px}
  .gfc .pkgs{padding:22px}
  .gfc .pkgs h4{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px}
  .pkg{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
  .pkg .pn{font-size:12px;font-weight:600;line-height:1.25}.pkg .pd{font-size:10.5px;color:var(--text-3)}
  .pkg .pg{font-size:9.5px;font-weight:700;color:var(--a2-ink,#0091B0);background:rgba(0,212,255,.12);padding:1px 7px;border-radius:999px}
  [data-theme="dark"] .pkg .pg{color:#7DE3FF}

  /* swimlane timeline */
  .swim{--lane:152px;position:relative;padding:6px 4px 2px}
  .lane{display:grid;grid-template-columns:var(--lane) 1fr;align-items:stretch}
  .lane .ln{font-size:12.5px;font-weight:600;color:var(--text);display:flex;align-items:center;padding-right:12px;border-bottom:1px solid var(--line)}
  .lane .track{position:relative;height:54px;border-bottom:1px solid var(--line)}
  .lane.head .track{height:30px}
  .lane.head .ln{border-bottom:1px solid var(--line-2)}
  .lane:last-child .track,.lane:last-child .ln{border-bottom:0}
  .swim-tick{position:absolute;bottom:5px;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--text-3)}
  .swim-flag{position:absolute;top:1px}
  .swim-flag .fdot{width:9px;height:9px;border-radius:50%;position:absolute;left:0;top:2px;transform:translateX(-50%);border:2px solid var(--surface)}
  .swim-flag .ftxt{position:absolute;left:0;transform:translateX(-50%);top:11px;font-size:8.5px;font-weight:700;color:var(--text-2);white-space:nowrap;text-align:center}
  .swim-flag .ftxt .fdt{font-weight:500;color:var(--muted)}
  .swim-today{position:absolute;top:0;bottom:0;width:2px;background:var(--a1);transform:translateX(-50%);z-index:3}
  .swim-today .tt{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:var(--grad);color:#fff;font-size:8.5px;font-weight:800;letter-spacing:.05em;padding:1px 6px;border-radius:999px;white-space:nowrap}
  .swim-today.soft{background:rgba(124,92,255,.3);z-index:1}
  .g-seg{position:absolute;top:50%;height:3px;background:var(--grad);transform:translateY(-50%);border-radius:3px;z-index:1}
  .g-m{position:absolute;top:50%;transform:translate(-50%,-50%);z-index:2}
  .g-dot{width:13px;height:13px;border-radius:50%;border:3px solid var(--surface);box-shadow:var(--lift)}
  .g-lab{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9.5px;font-weight:600;color:var(--text-2)}
  .g-lab.up{bottom:15px}.g-lab.dn{top:15px}
  .g-lab .gd{color:var(--muted);font-weight:500}
  .tl-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-2)}
  .tl-legend span{display:inline-flex;align-items:center;gap:6px}
  .tl-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

  /* discipline */
  .disc{padding:16px;display:flex;flex-direction:column;gap:12px}
  .disc:hover{box-shadow:var(--lift-2)}
  .disc .dt{display:flex;align-items:center;gap:13px}
  .disc .dn{font-size:14px;font-weight:600}.disc .dl{font-size:11.5px;color:var(--text-3)}
  .krow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
  .krow:first-child{border-top:0}.krow .k{color:var(--text-2)}
  .prov{font-size:10.5px;color:var(--muted);padding-top:9px;border-top:1px dashed var(--line-2);line-height:1.45;word-break:break-word}
  .prov .pv-d{color:var(--good);font-weight:700}
  .prov b{color:var(--text-3);font-weight:600}

  /* flows / steps / compare */
  .flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
  .fnode{flex:1;min-width:150px;padding:16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);display:flex;flex-direction:column;gap:9px;position:relative}
  .fnode .fh{display:flex;align-items:center;gap:10px}
  .fnode .ft{font-weight:700;font-size:13px}.fnode .fp{font-size:11.5px;color:var(--text-2);line-height:1.4}
  .farrow{display:grid;place-items:center;color:var(--muted);font-size:20px;padding:0 6px}
  .step{display:flex;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
  .step:first-child{border-top:0}
  .step .n{width:28px;height:28px;border-radius:8px;background:var(--inset);color:var(--a1);font-weight:700;font-size:13px;display:grid;place-items:center;flex-shrink:0}
  .step .st2{font-weight:600;font-size:13.5px}.step .sd2{font-size:12.5px;color:var(--text-2);margin-top:2px}
  .bigstat{text-align:center;padding:18px}
  .bigstat .bn{font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--a1)}
  .bigstat .bl{font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.4}
  .lead{font-size:14px;color:var(--text-2);line-height:1.65;max-width:66ch}
  .banner{background:linear-gradient(135deg,rgba(124,92,255,.10),rgba(0,212,255,.05));border:1px solid var(--line-2);border-radius:var(--r-lg);padding:22px 24px}
  .banner .bt{font-weight:700;font-size:16px;margin-bottom:8px}

  /* connected vs box */
  .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden}
  .vs .side2{padding:24px 20px;text-align:center}
  .vs .man2{background:var(--inset)}
  .vs .plg2{background:linear-gradient(135deg,rgba(124,92,255,.12),rgba(0,212,255,.06))}
  .vs .lab2{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
  .vs .big2{font-size:38px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
  .vs .man2 .big2{color:var(--warn)}
  .vs .plg2 .big2{color:var(--a1)}
  .vs .sub2{font-size:11.5px;color:var(--text-2);margin-top:4px}
  .vs .mid{text-align:center;padding:0 6px}
  .vs .mid .x{display:inline-block;font-size:13px;font-weight:800;color:#fff;background:var(--grad);border-radius:999px;padding:5px 12px;white-space:nowrap}
  @media(max-width:560px){.vs{grid-template-columns:1fr}.vs .mid{padding:8px 0}}

  /* compare list */
  .cmp{display:grid;grid-template-columns:1fr 1fr;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line)}
  .cmp>div{padding:16px 18px}.cmp .man{background:var(--inset)}.cmp .plg{background:linear-gradient(135deg,rgba(124,92,255,.08),rgba(0,212,255,.05))}
  .cmp .h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:9px}
  .cmp ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--text-2);line-height:1.7}
  @media(max-width:560px){.cmp{grid-template-columns:1fr}}

  /* 22 checks */
  .checks{columns:2;column-gap:28px}
  .ck-g{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--a1);margin:14px 0 6px;break-after:avoid}
  .ck-g:first-child{margin-top:0}
  [data-theme="dark"] .ck-g{color:#B9A8FF}
  .ck{display:flex;gap:9px;padding:5px 0;font-size:12.5px;color:var(--text-2);break-inside:avoid;align-items:baseline}
  .ck .ckn{width:20px;flex-shrink:0;font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums}
  @media(max-width:760px){.checks{columns:1}}

  /* rail */
  .rail{border-left:1px solid var(--line);background:var(--bg);padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto}
  .rail h3{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text);margin-bottom:4px}
  .rail .who{font-size:11.5px;color:var(--text-3);margin-bottom:10px}
  .rsel{width:100%;font:inherit;font-size:12.5px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--text);margin-bottom:16px}
  .rlabel{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
  .note{display:flex;gap:11px;padding:11px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);box-shadow:var(--lift);margin-bottom:9px}
  .note .ni{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex-shrink:0}
  .note .nt{font-size:12.5px;font-weight:600;line-height:1.3}
  .note .nd{font-size:11.5px;color:var(--text-2);margin-top:2px;line-height:1.35}
  .note .nw{font-size:10.5px;color:var(--muted);margin-top:3px}
  .ni.alert{background:rgba(224,85,110,.12);color:var(--bad)}
  .ni.deadline{background:rgba(201,138,0,.14);color:var(--warn)}
  .ni.approval{background:rgba(124,92,255,.12);color:var(--violet)}
  .ni.done{background:rgba(31,174,130,.12);color:var(--good)}
  .ni.info{background:rgba(0,212,255,.12);color:#0091B0}
  .ddl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:12px}
  .ddl:first-of-type{border-top:0}.ddl .dn2{font-weight:600}.ddl .dd{font-size:11px;color:var(--text-3)}

  .empty{text-align:center;padding:60px 20px;color:var(--text-3)}.empty .ei{font-size:34px;margin-bottom:10px}.empty h2{color:var(--text);font-size:18px;margin-bottom:6px}
  .empty .lead{margin:10px auto 0}
  .foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;text-wrap:pretty}

  .topbar-m{display:none}.scrim{display:none}
  @media(max-width:1180px){
    .content{grid-template-columns:1fr}
    .rail{position:static;height:auto;border-left:0;border-top:1px solid var(--line);padding:18px 30px 40px}
    .gfc{grid-template-columns:1fr}.gfc .hero{border-right:0;border-bottom:1px solid var(--line)}
  }
  @media(max-width:880px){
    .layout{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;width:262px;z-index:50;transform:translateX(-100%);transition:transform .28s var(--ease);box-shadow:var(--lift-2)}
    body.nav-open .side{transform:none}
    .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .28s}
    body.nav-open .scrim{opacity:1;pointer-events:auto}
    .topbar-m{display:flex;position:fixed;top:0;left:0;right:0;height:56px;align-items:center;gap:12px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line);z-index:30}
    .main{padding:74px 18px 40px}.rail{padding:18px}
    .ov{grid-template-columns:1fr}.top{flex-direction:column}
    .swim{--lane:110px}
  }
  @media (prefers-reduced-motion: reduce){ .ring .fl{transition:none} .side,.scrim{transition:none} }
</style>
</head>

function ring(pct,o={}){
  const size=o.size||120, r=size*0.42, C=2*Math.PI*r, off=C*(1-pct/100), sw=Math.max(6,size*0.075);
  const stroke=o.accent?"url(#gA)":(o.color||tcol(o.statusKey||tone(pct)));
  return el("div",{class:"ring",style:`width:${size}px;height:${size}px`},
    el("div",{html:`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle class="tk" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}"/><circle class="fl" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}" stroke="${stroke}" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>`}),

function timeline(){
  const min=new Date("2026-05-15"), max=new Date("2026-12-25"), span=max-min;
  const pos=d=>Math.max(0,Math.min(100,((new Date(d)-min)/span)*100));
  const kc={done:"var(--good)",pre:"var(--a2)",final:"var(--a1)",gateway:"var(--bad)"};
  /* build the milestone list from flags + per-discipline gateways */
  const ms=[];
  D.flags.forEach(f=>ms.push({l:f.t,d:f.d,k:(f.t==="SD sign-off"?"done":"gateway")}));
  const ab={"Architecture":"Arch","Structural":"Struct","Façade & Lifts":"Façade","Interiors":"Interiors","MEP & FAPA":"MEP","Services":"Services"};
  D.gateways.forEach(g=>{ const a=ab[g.disc]||g.disc; if(g.pre) ms.push({l:a+" Pre-GFC",d:g.pre,k:"pre"}); ms.push({l:a+" GFC",d:g.final,k:"final"}); });
  ms.forEach(mp=>mp.p=pos(mp.d));
  ms.sort((a,b)=>a.p-b.p);
  /* greedy level assignment per side so labels never overlap */
  const half=8, lastUp=[], lastDn=[];
  ms.forEach((mp,i)=>{ const up=i%2===0, arr=up?lastUp:lastDn; let lv=0;
    while(arr[lv]!==undefined && mp.p-half < arr[lv]) lv++;
    arr[lv]=mp.p+half; mp.up=up; mp.level=lv; });
  const rowH=30, pad=18;
  const upH=Math.max(1,lastUp.length)*rowH+pad, dnH=Math.max(1,lastDn.length)*rowH+pad;
  const todayP=pos(TODAY);
  const wrap=el("div",{class:"tl",style:`height:${upH+dnH}px`});
  wrap.appendChild(el("div",{class:"tl-line",style:`top:${upH}px`}));
  wrap.appendChild(el("div",{class:"tl-fill",style:`top:${upH}px;width:${todayP}%`}));
  [["2026-06-01","Jun"],["2026-07-01","Jul"],["2026-08-01","Aug"],["2026-09-01","Sep"],["2026-10-01","Oct"],["2026-11-01","Nov"],["2026-12-01","Dec"]]
    .forEach(mo=>wrap.appendChild(el("div",{class:"tl-tick",style:`left:${pos(mo[0])}%;top:${upH+8}px`},mo[1])));
  wrap.appendChild(el("div",{class:"tl-today",style:`left:${todayP}%;top:0;height:${upH+dnH}px`}));
  wrap.appendChild(el("div",{class:"tl-tpl",style:`left:${todayP}%;top:${upH-26}px`},"TODAY"));
  ms.forEach(mp=>{
    wrap.appendChild(el("div",{class:"tl-dot",style:`left:${mp.p}%;top:${upH}px;background:${kc[mp.k]}`}));
    const labTop = mp.up ? (upH - (mp.level+1)*rowH) : (upH + pad + mp.level*rowH);
    if(mp.up) wrap.appendChild(el("div",{class:"tl-conn",style:`left:${mp.p}%;top:${labTop+18}px;height:${upH-(labTop+18)}px`}));
    else      wrap.appendChild(el("div",{class:"tl-conn",style:`left:${mp.p}%;top:${upH}px;height:${labTop-upH}px`}));
    wrap.appendChild(el("div",{class:"tl-lab",style:`left:${mp.p}%;top:${labTop}px`},
      el("div",{class:"tl-nm"},mp.l), el("div",{class:"tl-dt"},fmtD(mp.d))));
  });
  return wrap;
}
