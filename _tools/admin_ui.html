<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Asure AI Research</title>
<style>
/* Self-contained on purpose: the admin is served from _tools/ and must keep
   working even while the site's own stylesheets are being edited. */
:root{
  --bg:#0A0D18; --surface:#121727; --surface-2:#171d31; --line:#232b44; --line-2:#2b3450;
  --text:#e8ecf6; --text-2:#a8b2cc; --text-3:#6f7c9c;
  --navy:#2f6db5; --navy-ink:#b9d2ec; --green:#22E6A8; --amber:#FFB020; --red:#FF6B85;
  --r:8px; --r-lg:12px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans);
     display:grid;grid-template-columns:288px 1fr;overflow:hidden}

/* ---------- rail ---------- */
.rail{border-right:1px solid var(--line-2);background:var(--surface);
      display:flex;flex-direction:column;min-height:0}
.rail h1{margin:0;padding:20px 18px 12px;font-size:13px;letter-spacing:.16em;
         text-transform:uppercase;color:var(--text-3);font-weight:600}
.newbtn{margin:0 14px 12px;padding:9px;border:1px dashed var(--line-2);background:transparent;
        color:var(--navy-ink);border-radius:var(--r);cursor:pointer;font:inherit;font-size:13px}
.newbtn:hover{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 14%,transparent)}
.search{margin:0 14px 10px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line-2);
        border-radius:var(--r);color:var(--text);font:inherit;font-size:13px}
.list{flex:1;overflow-y:auto;padding:0 8px 16px}
.item{display:flex;gap:9px;align-items:baseline;padding:8px 10px;border-radius:var(--r);cursor:pointer}
.item:hover{background:var(--surface-2)}
.item.on{background:color-mix(in srgb,var(--navy) 20%,transparent)}
.item.on .nm{color:var(--navy-ink)}
.item .cd{font-family:var(--mono);font-size:11px;color:var(--text-3);flex:none;width:30px}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--text-3);opacity:.5}
.dot.has{background:var(--green);opacity:1}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;gap:10px;align-items:center;padding:13px 22px;border-bottom:1px solid var(--line-2);
     background:var(--surface)}
.bar .sp{flex:1}
.btn{border:1px solid var(--line-2);background:transparent;color:var(--text-2);
     border-radius:var(--r);padding:8px 14px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{color:var(--text);border-color:var(--text-3)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.btn.pri:hover{background:#23588f}
.btn.danger:hover{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pane{flex:1;overflow-y:auto;padding:26px 22px 80px}
.wrap{max-width:820px}

fieldset{border:1px solid var(--line-2);border-radius:var(--r-lg);padding:18px 20px 22px;margin:0 0 20px;
         background:var(--surface)}
legend{padding:0 8px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r);
  color:var(--text);font:inherit;font-size:13px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
.full{grid-column:1/-1}
.hint{margin-top:5px;font-size:11px;color:var(--text-3)}
.req::after{content:" *";color:var(--amber)}

/* ---------- media ---------- */
.slot{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.slot:first-of-type{border-top:0;padding-top:0;margin-top:0}
.slot h4{margin:0 0 3px;font-size:13px;font-weight:600}
.slot .sub{margin:0 0 10px;font-size:11px;color:var(--text-3)}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.file{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line-2);
      border-radius:var(--r);padding:5px 6px 5px 9px;font-size:12px}
.file.hero{border-color:var(--green);color:#8af0cd}
.file img{width:34px;height:22px;object-fit:cover;border-radius:3px;display:block}
.file button{border:0;background:transparent;color:var(--text-3);cursor:pointer;font-size:15px;line-height:1;padding:0 3px}
.file button:hover{color:var(--red)}
.drop{border:1px dashed var(--line-2);border-radius:var(--r);padding:14px;text-align:center;
      color:var(--text-3);font-size:12px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--navy);color:var(--navy-ink);
      background:color-mix(in srgb,var(--navy) 10%,transparent)}

/* ---------- source panel ---------- */
.srcbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.srcpath{flex:1;min-width:220px;font-family:var(--mono);font-size:11px;color:var(--text-2);
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 9px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line-2);
  border-radius:var(--r);margin-bottom:6px;cursor:pointer;font-size:12px}
.sug:hover{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 10%,transparent)}
.sug .cf{flex:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.cf.high{background:color-mix(in srgb,var(--green) 20%,transparent);color:#8af0cd}
.cf.medium{background:color-mix(in srgb,var(--amber) 20%,transparent);color:#ffd08a}
.cf.low{background:var(--surface-2);color:var(--text-3)}
.sug .pp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);font-size:11px;color:var(--text-2)}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0;font-size:12px;color:var(--text-3)}
.facts b{color:var(--text);font-weight:600}
.imp{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
.imp h5{margin:0 0 7px;font-size:12px;font-weight:600;color:var(--text-2)}
.impf{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.impf .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);font-size:11px;color:var(--text-3)}
.impf .sz{flex:none;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.impf button{flex:none;border:1px solid var(--line-2);background:transparent;color:var(--text-2);
  border-radius:4px;font-size:11px;padding:3px 9px;cursor:pointer}
.impf button:hover{border-color:var(--navy);color:var(--navy-ink)}
details.rm{margin-top:12px;border:1px solid var(--line-2);border-radius:var(--r);padding:9px 12px}
details.rm summary{cursor:pointer;font-size:12px;color:var(--text-2)}
details.rm pre{margin:10px 0 0;max-height:280px;overflow:auto;font-size:11px;line-height:1.55;
  color:var(--text-2);white-space:pre-wrap}
.gitlog{margin-top:8px;font-size:11px;color:var(--text-3);line-height:1.7}

/* ---------- misc ---------- */
.rows-in{display:flex;flex-direction:column;gap:8px}
.rowline{display:flex;gap:8px}
.rowline input{flex:1}
.rowline button{flex:none;border:1px solid var(--line-2);background:transparent;color:var(--text-3);
                border-radius:var(--r);cursor:pointer;padding:0 10px}
.rowline button:hover{color:var(--red);border-color:var(--red)}
.addrow{margin-top:8px;border:1px dashed var(--line-2);background:transparent;color:var(--text-3);
        border-radius:var(--r);padding:6px 12px;cursor:pointer;font:inherit;font-size:12px}
.addrow:hover{color:var(--navy-ink);border-color:var(--navy)}
.toast{position:fixed;right:20px;bottom:20px;max-width:520px;background:var(--surface-2);
       border:1px solid var(--line-2);border-left:3px solid var(--navy);border-radius:var(--r);
       padding:12px 16px;font-size:13px;white-space:pre-wrap;box-shadow:0 12px 32px rgba(0,0,0,.5);
       opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}
.empty{color:var(--text-3);text-align:center;padding:70px 20px}
code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>

<aside class="rail">
  <h1>Projects <span id="count" style="color:var(--text-3)"></span></h1>
  <button class="newbtn" id="new">+ New project</button>
  <input class="search" id="q" type="search" placeholder="Filter…" autocomplete="off">
  <div class="list" id="list"></div>
</aside>

<div class="main">
  <div class="bar">
    <strong id="title" style="font-size:14px">Select a project</strong>
    <span class="sp"></span>
    <button class="btn danger" id="del" disabled>Delete</button>
    <button class="btn" id="publish">Republish</button>
    <button class="btn pri" id="save" disabled>Save</button>
  </div>
  <div class="pane"><div class="wrap" id="form">
    <div class="empty">Pick a project on the left, or create a new one.</div>
  </div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let META = {}, ALL = [], cur = null, dirty = false;

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind||'');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.className='toast '+(kind||''), kind==='err'?7000:2600);
}
async function api(path, opts){
  const r = await fetch(path, opts);
  const j = await r.json().catch(()=>({error:'bad response'}));
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}
function markDirty(){ dirty = true; $('#save').disabled = false; }

/* ------------------------------------------------------------------ list */
function renderList(){
  const q = $('#q').value.trim().toLowerCase();
  const rows = ALL.filter(p => !q || (p.code+' '+p.name+' '+p.id+' '+p.kind).toLowerCase().includes(q));
  $('#count').textContent = rows.length === ALL.length ? ALL.length : rows.length+'/'+ALL.length;
  $('#list').innerHTML = rows.map(p => {
    const n = Object.values(p._media||{}).reduce((a,b)=>a+b.length,0);
    return `<div class="item ${cur&&cur.id===p.id?'on':''}" data-id="${esc(p.id)}">
      <span class="cd">${esc(p.code)}</span>
      <span class="nm">${esc(p.name)}</span>
      <span class="dot ${n?'has':''}" title="${n} file${n===1?'':'s'}"></span></div>`;
  }).join('') || '<div class="empty" style="padding:30px;font-size:13px">Nothing matches</div>';
}

/* ------------------------------------------------------------------ form */
function listField(key, label, hint){
  const vals = (cur.page && cur.page[key]) || [];
  return `<div class="full"><label>${label}</label><div class="rows-in" data-list="${key}">
    ${vals.map(v=>`<div class="rowline"><input value="${esc(v)}"><button data-x>&times;</button></div>`).join('')}
  </div><button class="addrow" data-add="${key}">+ Add</button>
  ${hint?`<div class="hint">${hint}</div>`:''}</div>`;
}

function renderForm(){
  if(!cur){ $('#form').innerHTML = '<div class="empty">Pick a project on the left, or create a new one.</div>';
            $('#title').textContent='Select a project'; $('#del').disabled=$('#save').disabled=true; return; }
  const pg = cur.page || {}, m = cur._media || {};
  $('#title').textContent = (cur.code||'new') + ' · ' + (cur.name||'Untitled');
  $('#del').disabled = !cur._exists;

  $('#form').innerHTML = `
  <fieldset><legend>Identity</legend><div class="grid">
    <div><label class="req">Code</label><input name="code" value="${esc(cur.code)}"></div>
    <div><label class="req">Id</label><input name="id" value="${esc(cur.id)}" ${cur._exists?'disabled':''}>
      <div class="hint">${cur._exists?'Fixed once created — it is the folder name.':'lowercase, hyphens. Becomes the folder name.'}</div></div>
    <div class="full"><label class="req">Name</label><input name="name" value="${esc(cur.name)}"></div>
    <div><label class="req">Kind</label><select name="kind">${META.kinds.map(k=>`<option ${k===cur.kind?'selected':''}>${k}</option>`).join('')}</select></div>
    <div><label class="req">Domain</label><select name="domain">${META.domains.map(k=>`<option ${k===cur.domain?'selected':''}>${k}</option>`).join('')}</select></div>
    <div><label class="req">Status</label><select name="status">${META.statuses.map(k=>`<option ${k===cur.status?'selected':''}>${k}</option>`).join('')}</select></div>
    <div><label>Workflow stage</label><input name="workflowStage" value="${esc(cur.workflowStage)}"></div>
    <div><label>Logo</label><input name="logo" value="${esc(cur.logo)}"><div class="hint">e.g. revit, asure, python</div></div>
    <div><label>Tech</label><input name="tech" value="${esc((cur.tech||[]).join(', '))}"><div class="hint">comma separated</div></div>
  </div></fieldset>

  <fieldset><legend>Copy</legend><div class="grid">
    <div class="full"><label class="req">Tagline</label><input name="tagline" value="${esc(cur.tagline)}">
      <div class="hint">One line, ~12 words. Shows on the card.</div></div>
    <div class="full"><label>Objective</label><textarea name="page.objective">${esc(pg.objective)}</textarea></div>
    <div class="full"><label>Problem</label><textarea name="page.problem">${esc(pg.problem)}</textarea></div>
    <div class="full"><label>Solution</label><textarea name="page.solution">${esc(pg.solution)}</textarea></div>
    <div class="full"><label>Description</label><textarea name="description">${esc(cur.description)}</textarea></div>
  </div></fieldset>

  <fieldset><legend>Detail — optional, only 1 of 52 has these today</legend><div class="grid">
    ${listField('challenges','Challenges')}
    ${listField('lessons','Lessons learned')}
    ${listField('roadmap','What&rsquo;s next')}
    <div class="full"><label>Related projects</label>
      <input name="related" value="${esc((cur.related||[]).join(', '))}">
      <div class="hint">comma separated ids, e.g. h10-dashboard, revit-mcp</div></div>
  </div></fieldset>

  <fieldset><legend>Source folder — where this project actually lives</legend>
    <div id="srcbox"><div class="hint">Save the project first.</div></div>
  </fieldset>

  <fieldset><legend>Media</legend>
    ${cur._exists ? META.slots.map(slotBlock).join('')
      : '<div class="hint">Save the project first, then you can upload files.</div>'}
  </fieldset>`;

  $('#form').querySelectorAll('input,select,textarea').forEach(el=>{
    el.addEventListener('input', markDirty); el.addEventListener('change', markDirty);
  });
  $('#form').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const box = $('#form').querySelector(`[data-list="${b.dataset.add}"]`);
    const d = document.createElement('div'); d.className='rowline';
    d.innerHTML = '<input><button data-x>&times;</button>';
    box.appendChild(d); wireRows(); d.querySelector('input').focus(); markDirty();
  });
  wireRows();
  if(cur._exists){ wireUploads(); renderSource(); }
}

function wireRows(){
  $('#form').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ b.closest('.rowline').remove(); markDirty(); });
  $('#form').querySelectorAll('.rows-in input').forEach(i=>i.oninput=markDirty);
}

const SLOT_HELP = {
  screenshots:'hero is the card + page image; every other file becomes the gallery, in filename order. Resized to 1600px on upload.',
  videos:'Inline players, filename order.',
  html:'Adds an "Open live preview" button.',
  docs:'Adds a download button, labelled from the filename.'
};
function slotBlock(slot){
  const files = (cur._media||{})[slot] || [];
  return `<div class="slot"><h4>${slot}</h4><p class="sub">${SLOT_HELP[slot]||''}</p>
    <div class="files">${files.map(f=>{
      const isHero = slot==='screenshots' && /^hero\./i.test(f);
      const thumb = slot==='screenshots'
        ? `<img src="/media/${encodeURIComponent(cur.id)}/${slot}/${encodeURIComponent(f)}" onerror="this.remove()">` : '';
      return `<span class="file ${isHero?'hero':''}">${thumb}${esc(f)}
        <button data-rm="${esc(slot)}|${esc(f)}" title="Remove">&times;</button></span>`;
    }).join('') || '<span class="hint">nothing yet</span>'}</div>
    <div class="drop" data-slot="${slot}">Drop a file here, or click to choose${slot==='screenshots'?' — name it hero to make it the card image':''}</div></div>`;
}

function wireUploads(){
  $('#form').querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
    const [slot,name] = b.dataset.rm.split('|');
    if(!confirm('Remove '+name+'? The file is deleted from disk.')) return;
    try{ await api('/api/delete-media',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:cur.id,slot,name})});
      toast('Removed '+name,'ok'); await reload(cur.id);
    }catch(e){ toast(e.message,'err'); }
  });
  $('#form').querySelectorAll('.drop').forEach(d=>{
    const slot = d.dataset.slot;
    const pick = () => { const i=document.createElement('input'); i.type='file';
      i.onchange=()=>i.files[0]&&send(i.files[0]); i.click(); };
    const send = async file => {
      const fd = new FormData();
      fd.append('id',cur.id); fd.append('slot',slot); fd.append('file',file);
      if(slot==='screenshots' && !(cur._media.screenshots||[]).some(f=>/^hero\./i.test(f)))
        fd.append('hero','1');
      d.textContent = 'Uploading ' + file.name + '…';
      try{ const r = await api('/api/upload',{method:'POST',body:fd});
        toast('Uploaded ' + r.uploaded + (r.resized?' (resized to 1600px)':'') + (r.warning? '\n'+r.warning:''), r.warning?'':'ok');
        await reload(cur.id);
      }catch(e){ toast(e.message,'err'); renderForm(); }
    };
    d.onclick = pick;
    d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = e => { e.preventDefault(); d.classList.remove('over');
      if(e.dataTransfer.files[0]) send(e.dataTransfer.files[0]); };
  });
}


/* ---------------------------------------------------------------- source
   Linking a project to its real folder on disk, then pulling media and facts
   across from it. Suggestions are ranked but never applied automatically --
   folder names lie, and a wrong link quietly attaches the wrong screenshots. */
const KB = n => n>1048576 ? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB';
const SLOT_FOR = ext => ({
  '.png':'screenshots','.jpg':'screenshots','.jpeg':'screenshots','.webp':'screenshots','.gif':'screenshots',
  '.mp4':'videos','.webm':'videos','.mov':'videos',
  '.html':'html','.htm':'html',
  '.pdf':'docs','.xlsx':'docs','.xls':'docs','.docx':'docs','.doc':'docs','.pptx':'docs','.csv':'docs','.zip':'docs'
}[ext] || null);

async function renderSource(){
  const box = $('#srcbox');
  if(!cur || !cur._exists){ box.innerHTML = '<div class="hint">Save the project first.</div>'; return; }
  box.innerHTML = '<div class="hint">Looking for matching folders…</div>';
  let info;
  try{ info = await api('/api/sources/suggest?id=' + encodeURIComponent(cur.id)); }
  catch(e){ box.innerHTML = '<div class="hint">'+esc(e.message)+'</div>'; return; }

  if(!info.linked){
    box.innerHTML = `<div class="hint" style="margin-bottom:10px">Not linked yet. Pick the folder this project lives in — everything else reads from it.</div>
      ${(info.suggestions||[]).map(sg=>`<div class="sug" data-link="${esc(sg.path)}">
        <span class="cf ${sg.confidence}">${sg.confidence}</span>
        <span class="pp">${esc(sg.path)}</span></div>`).join('') || '<div class="hint">No candidates found.</div>'}
      <div class="srcbar" style="margin-top:10px">
        <input class="srcpath" id="manualPath" placeholder="…or paste a full folder path">
        <button class="btn" id="linkManual">Link</button></div>`;
    box.querySelectorAll('[data-link]').forEach(el=>el.onclick=()=>link(el.dataset.link));
    box.querySelector('#linkManual').onclick = () => link(box.querySelector('#manualPath').value.trim());
    return;
  }

  box.innerHTML = `<div class="srcbar">
      <span class="srcpath" title="${esc(info.linked)}">${esc(info.linked)}</span>
      <button class="btn" id="rescan">Rescan</button>
      <button class="btn" id="unlink">Unlink</button></div>
    <div id="scanout"><div class="hint">Scanning…</div></div>`;
  box.querySelector('#unlink').onclick = () => link('');
  box.querySelector('#rescan').onclick = renderSource;
  renderScan();
}

async function link(path){
  if(!path) { if(!confirm('Unlink this project from its folder?')) return; }
  try{
    await api('/api/sources/link',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:cur.id, path:path||null})});
    toast(path ? 'Linked' : 'Unlinked','ok');
    renderSource();
  }catch(e){ toast(e.message,'err'); }
}

async function renderScan(){
  const out = $('#scanout'); if(!out) return;
  let s;
  try{ s = await api('/api/sources/scan?id=' + encodeURIComponent(cur.id)); }
  catch(e){ out.innerHTML = '<div class="hint">'+esc(e.message)+'</div>'; return; }
  if(s.missing){ out.innerHTML = '<div class="hint">That folder no longer exists.</div>'; return; }

  const g = s.git;
  const facts = `<div class="facts">
    <span><b>${s.files}</b> files</span><span><b>${KB(s.bytes)}</b></span>
    <span>last touched <b>${esc(s.lastModified||'?')}</b></span>
    ${g?`<span><b>${g.commits}</b> commits · ${esc(g.first)} → ${esc(g.last)}</span>`:'<span>not a git repo</span>'}
  </div>`;

  const importable = [['images','Screenshots & renders'],['videos','Video'],
                      ['web','Live demos (html)'],['docs','Documents']];
  const lists = importable.map(([k,label])=>{
    const items = (s.buckets[k]||[]);
    if(!items.length) return '';
    return `<div class="imp"><h5>${label} — ${items.length} found</h5>
      ${items.slice(0,12).map(f=>`<div class="impf">
        <span class="fn" title="${esc(f.rel)}">${esc(f.rel)}</span>
        <span class="sz">${KB(f.size)}</span>
        <button data-imp="${esc(f.path)}">Import</button>
        ${k==='images'?`<button data-imp="${esc(f.path)}" data-hero="1">as hero</button>`:''}
      </div>`).join('')}
      ${items.length>12?`<div class="hint">+${items.length-12} more, largest shown first</div>`:''}</div>`;
  }).join('');

  const rm = s.readme ? `<details class="rm"><summary>${esc(s.readme.name)} — write the copy from this, do not paste it</summary>
      <pre>${esc(s.readme.text)}</pre></details>` : '';
  const log = g && g.recent.length ? `<details class="rm"><summary>Recent commits — dates for the timeline</summary>
      <div class="gitlog">${g.recent.map(c=>`${esc(c.date)} · ${esc(c.subject)}`).join('<br>')}</div></details>` : '';

  out.innerHTML = facts + (lists || '<div class="hint">Nothing importable found in that folder.</div>') + rm + log;

  out.querySelectorAll('[data-imp]').forEach(b=>b.onclick=async()=>{
    const path = b.dataset.imp;
    const ext = ('.'+path.split('.').pop()).toLowerCase();
    const slot = SLOT_FOR(ext);
    if(!slot){ toast('No slot accepts '+ext,'err'); return; }
    const label = b.textContent; b.textContent = '…'; b.disabled = true;
    try{
      const r = await api('/api/sources/import',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:cur.id, slot, path, hero:b.dataset.hero==='1'})});
      toast('Imported '+r.imported+(r.resized?' (resized)':''),'ok');
      await reload(cur.id);
    }catch(e){ toast(e.message,'err'); b.textContent=label; b.disabled=false; }
  });
}

/* ------------------------------------------------------------------ io */
function collect(){
  const f = $('#form'), get = n => { const el=f.querySelector(`[name="${n}"]`); return el?el.value.trim():''; };
  const rec = { id: cur._exists ? cur.id : get('id'), code:get('code'), name:get('name'),
    status:get('status'), kind:get('kind'), domain:get('domain'),
    workflowStage:get('workflowStage'), logo:get('logo'), tagline:get('tagline'),
    description:get('description'),
    tech: get('tech').split(',').map(s=>s.trim()).filter(Boolean),
    related: get('related').split(',').map(s=>s.trim()).filter(Boolean), page:{} };
  ['objective','problem','solution'].forEach(k=>{ const v=get('page.'+k); if(v) rec.page[k]=v; });
  f.querySelectorAll('[data-list]').forEach(box=>{
    const vals=[...box.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);
    if(vals.length) rec.page[box.dataset.list]=vals;
  });
  if(cur.page){ ['howItWorks','timeline'].forEach(k=>{ if(cur.page[k]) rec.page[k]=cur.page[k]; }); }
  if(cur.efficiency) rec.efficiency = cur.efficiency;
  return rec;
}

async function reload(selectId){
  ALL = await api('/api/projects');
  META.nextCode = (await api('/api/meta')).nextCode;
  const found = ALL.find(p=>p.id===selectId);
  if(found){ cur = Object.assign({}, found, {_exists:true}); }
  renderList(); renderForm();
  dirty=false; $('#save').disabled=true;
}

$('#save').onclick = async () => {
  const rec = collect();
  if(!rec.id){ toast('Give it an id first','err'); return; }
  try{
    const r = await api('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(rec)});
    toast('Saved · site regenerated','ok');
    await reload(r.saved);
  }catch(e){ toast(e.message,'err'); }
};

$('#del').onclick = async () => {
  if(!cur||!cur._exists) return;
  if(!confirm('Delete '+cur.code+' '+cur.name+'?\n\nThe record is removed. Uploaded files are kept on disk.')) return;
  try{ await api('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:cur.id})});
    toast('Deleted — media folder kept','ok'); cur=null; await reload();
  }catch(e){ toast(e.message,'err'); }
};

$('#publish').onclick = async () => {
  try{ const r = await api('/api/publish',{method:'POST'});
    toast(r.steps.map(s=>s.out.trim()).join('\n'), r.steps.every(s=>s.ok)?'ok':'err');
  }catch(e){ toast(e.message,'err'); }
};

$('#new').onclick = () => {
  if(dirty && !confirm('Discard unsaved changes?')) return;
  cur = { id:'', code:META.nextCode, name:'', status:'in-progress', kind:'plugin',
          domain:'design', workflowStage:'', logo:'asure', tagline:'', description:'',
          tech:[], related:[], page:{}, _media:{}, _exists:false };
  renderList(); renderForm(); markDirty();
  $('#form').querySelector('[name="name"]').focus();
};

$('#q').oninput = renderList;
$('#list').onclick = e => {
  const it = e.target.closest('.item'); if(!it) return;
  if(dirty && !confirm('Discard unsaved changes?')) return;
  cur = Object.assign({}, ALL.find(p=>p.id===it.dataset.id), {_exists:true});
  dirty=false; $('#save').disabled=true;
  renderList(); renderForm();
};
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('keydown', e => {
  if((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); if(!$('#save').disabled) $('#save').click(); }
});

(async () => {
  try{
    META = await api('/api/meta');
    ALL = await api('/api/projects');
    renderList(); renderForm();
    if(!META.pillow) toast('Pillow not installed — uploads are stored without resizing.');
  }catch(e){ document.body.innerHTML = '<div class="empty">Could not reach the admin server.<br>'+esc(e.message)+'</div>'; }
})();
</script>
</body>
</html>
