<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool — AI Research &amp; Innovation</title>
<meta name="description" content="AI Research & Innovation — tool detail.">
<link rel="icon" href="assets/logos/brand/favicon.png">
<!-- Same load order as the landing page: the kit first so our radii win
     globally, then the bridge last to re-point the kit's tokens. -->
<link rel="stylesheet" href="assets/vendor/asure-ui-kit/asure-ui.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/deck.css">
<link rel="stylesheet" href="assets/css/uikit-bridge.css">
<link rel="stylesheet" href="assets/css/loader.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>

<body class="a-app deck uikit">

<!-- Asure -> Evolve opening. In the markup, not injected, so it paints on the
     first frame. assets/js/loader.js removes it once the page has rendered. -->
<div class="evo-loader" id="evoLoader" role="status" aria-live="polite" aria-label="Loading">
  <div class="evo-inner">
    <div class="evo-stage">
      <img class="evo-wm evo-asure" src="assets/loader/asure.png" alt="" aria-hidden="true">
      <span class="evo-flare" aria-hidden="true"></span>
      <img class="evo-wm evo-evolve" src="assets/loader/evolve.png" alt="Evolve">
      <span class="evo-colour" aria-hidden="true"></span>
      <span class="evo-shine" aria-hidden="true"></span>
    </div>
    <div class="evo-status">
      <div class="evo-copy"><span>Loading</span>
        <span class="evo-dots"><i></i><i></i><i></i></span></div>
      <div class="evo-track"></div>
    </div>
  </div>
</div>
<!-- /evo -->


<aside class="a-sidebar no-print" id="rail">
  <a class="a-sidebar-brand" href="index.html">
    <img class="wm lightonly" src="assets/logos/brand/asure_wordmark.png" alt="asure">
    <img class="wm darkonly" src="assets/logos/brand/asure_wordmark_white.png" alt="" aria-hidden="true">
    <span class="a-brand-cap">Research</span>
  </a>
  <nav class="a-nav" id="nav"></nav>
  <div class="a-sidebar-foot">EVOLVE · Empower with Knowledge</div>
</aside>

<div class="a-main">

  <header class="a-topbar no-print">
    <button class="btn icon ghost rail-toggle" id="railToggle" aria-label="Menu"></button>
    <div class="crumb" style="min-width:0">
      <a href="index.html">All work</a>
      <span id="crumbSep"></span>
      <span id="crumbNow" style="color:var(--text-2)"></span>
    </div>
    <div class="a-topbar-spacer"></div>
    <span class="a-pill" id="pillKind" style="min-width:104px">—</span>
    <a class="nl" href="index.html">Back</a>
    <button class="btn icon ghost" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
  </header>

  <main class="a-view">
    <div class="a-content">
      <div id="tp"><!-- tool content injected --></div>
    </div>
  </main>

  <!-- The drawing-sheet footer, same as the landing page. -->
  <div class="a-titleblock no-print">
    <div class="a-tb-brand">
      <img src="assets/logos/brand/asure_wordmark_white.png" alt="asure">
      <span>Design Studio</span>
    </div>
    <div class="a-tb-cell">
      <span class="a-label">Code</span><span id="tbCode">—</span>
    </div>
    <div class="a-tb-cell">
      <span class="a-label">Kind</span><span id="tbKind">—</span>
    </div>
    <div class="a-tb-cell">
      <span class="a-label">Serves</span><span id="tbDomain">—</span>
    </div>
    <div class="a-tb-spacer"></div>
    <div class="a-tb-cell">
      <span class="a-label">Status</span><span id="tbStatus">—</span>
    </div>
  </div>

</div><!-- /.a-main -->

<div class="lightbox" id="lightbox"><div class="x" id="lbClose"></div><img id="lbImg" alt=""></div>

<script src="assets/js/loader.js"></script>

</html>
